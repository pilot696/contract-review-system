[project]
name = "contract-review-system"
version = "0.1.0"
description = "合同审批审查系统 —— 合同自动风险审查工具服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
# M2 解析阶段安装：uv sync --extra parsing
parsing = [
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "rapidocr-onnxruntime>=1.4,<2",
  "pillow>=10",
]
# M4 MCP 入口阶段安装：uv sync --extra mcp
mcp = [
  "mcp>=1.2,<2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "reportlab>=4",
  "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # FastAPI TestClient 依赖的 starlette 1.x 内部告警，与本项目代码无关
  "ignore:Using `httpx` with `starlette.testclient`.*",
]
markers = [
  "slow: 需要 OCR/大文件",
  "integration: 需要 PostgreSQL",
]
