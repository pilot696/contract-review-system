# 本地备选数据库：日常开发使用 .env 中 DATABASE_URL 指向的 PostgreSQL。
# 只有在本机 Docker 可用、且需要完全离线自包含时才启用：
#   docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: crs-postgres
    environment:
      POSTGRES_USER: crs
      # 占位口令，可用环境变量 POSTGRES_PASSWORD 覆盖
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: contract_review
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crs -d contract_review"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
